name: Publish custom host image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.custom-host
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/instatic-custom-host:latest
            ghcr.io/${{ github.repository_owner }}/instatic-custom-host:${{ github.sha }}
